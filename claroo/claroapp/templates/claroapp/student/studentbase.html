{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>{% block title %}Claro{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            font-family: monospace;
            align-items: center;
            display: flex;
            justify-content: flex-start;
            background-color: #66ABEE;
            color: white;
            padding: 0 1%;
            height: 90px;
            box-sizing: border-box;
        }

        button.logo {
            border-radius: 45%;
            margin: 0;
            padding: 0;
            border-style: none;
            background-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-top: -10px;
        }

        .navbar-text {
            margin-left: 8%;
            margin-right: auto;
            font-family: 'Baloo 2', cursive;
            font-weight: bold;
        }

        button.icons {
            cursor: pointer;
            border-style: none;
            background-color: transparent;
            padding: 0;
            margin: 0 1%;
        }

        .icon-container {
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        #notiff {
            margin-right: 20px;
        }

        #Menu {
            margin-right: 10px;
        }

        .left-container {
            background-color: rgba(78, 132, 196, 1);
            width: 150px;
            /* Adjust the width as needed */
            height: calc(100vh - 90px);
            /* Full height minus header height */
            position: absolute;
            top: 90px;
            /* Below the header */
            width: 270px;
            box-sizing: border-box;
            color: white;
            font-family: 'Baloo 2', cursive;
            display: flex;
            flex-direction: column;
        }

        .inner-container {
            background-color: rgba(78, 132, 196, 1);
            flex: 1;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #profile-container {
            height: 110px;
            width: 100%;
            flex: none;
            overflow: hidden;
            position: relative;
        }

        .nav-container {
            background-color: rgba(78, 132, 196, 1);
            height: 110px;
            position: absolute;
            top: 90px;
            /* Same as left-container top */
            left: 270px;
            /* Width of left-container */
            right: 0;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            font-family: 'Baloo 2', bold;
            box-shadow: inset 0 8px 10px -4px rgba(0, 0, 0, 0.2);
        }

        .profile-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center -18.9px;
            filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.3));
            /* Centered shadow */
        }

        .profile-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-pic {
            font-size: 2.5rem;
            color: white;
        }

        .profile-info {
            text-align: left;
        }

        .user-name {
            font-weight: bold;
            margin-bottom: -5px;
            text-transform: uppercase;
        }

        .user-email {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .split-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: white;

        }

        .search-container {
            position: relative;
            width: 80%;
        }

        .search-input {
            width: 100%;
            padding: 8px 35px 8px 15px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #333;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: #999;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(102, 171, 238, 1);
            font-size: 16px;
            /* Increased from 14px */
            font-weight: bold;
            /* Added font weight */
        }

        .search-input:focus {
            outline: none;
        }

        button.logo:focus {
            outline: none;
        }

        button.icons:focus {
            outline: none;
        }

        .split-top {
            background-color: rgba(102, 171, 238, 1);
            height: 20%;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border-bottom-right-radius: 25px;
        }

        .split-bottom {
            background-color: white;
            height: 80%;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <button type="button" class="logo"><img src="{% static 'images/claroLogo.svg' %}" alt="Logo" id="Logo"
                class="logo"> </button>
        <span class="navbar-text">
            * {% block page_name %}{% endblock %}
        </span>
        <div class="icon-container">
            <button type="button" id="notiff" class="icons"><img src="{% static 'images/Doorbell.svg' %}"
                    alt="Bell"></button>
            <button type="button" id="Menu" class="icons"><img src="{% static 'images/Menu.svg' %}" alt="Menu"></button>
        </div>
    </header>

    <div class="left-container">
        <div class="inner-container" id="profile-container">
            <div class="profile-text">
                <div class="profile-pic">
                    <i class="bi bi-person-circle"></i>
                </div>
                <div class="profile-info">
                    <div class="user-name">{{ full_name }}</div>
                    <div class="user-email">{{ email }}</div>
                </div>
            </div>
            <img src="{% static 'images/prof_bg.svg' %}" alt="Profile Background" class="profile-bg">
        </div>
        <div class="inner-container">
            <div class="split-container">
                <div class="split-top">
                    <div class="search-container">
                        <input type="text" class="search-input" placeholder="Search course">
                        <i class="bi bi-search search-icon"></i>
                    </div>
                </div>
                <div class="split-bottom">Bottom Content</div>
            </div>
        </div>
        <div class="inner-container">Container 3</div>
    </div>
    <div class="nav-container">
        Navigation Content
    </div>

    <div id="content" name="content" style="margin-left: 160px;">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>

</html>
